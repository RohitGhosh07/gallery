<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drive Gallery + Fullscreen + People (Face Match)</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FaceAPI -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@0.30.5/dist/face-api.js"></script>
  </head>

  <body class="bg-zinc-950 text-zinc-100">
    <!-- Top bar -->
    <header class="sticky top-0 z-40 border-b border-white/10 bg-zinc-950/70 backdrop-blur">
      <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-3">
        <div class="flex items-center gap-2">
          <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-500"></div>
          <div class="leading-tight">
            <p class="text-sm font-semibold">Gallery</p>
            <p id="statusLine" class="text-xs text-zinc-400">Loading Drive images…</p>
          </div>
        </div>

        <div class="ml-auto flex items-center gap-2">
          <div class="hidden sm:flex items-center gap-2 rounded-2xl border border-white/10 bg-white/5 px-3 py-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 21l-4.3-4.3" />
              <circle cx="11" cy="11" r="7" />
            </svg>
            <input id="searchInput" class="w-64 bg-transparent text-sm outline-none placeholder:text-zinc-500" placeholder="Search..." />
          </div>

          <button id="peopleToggle" class="rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-sm hover:bg-white/10">
            People
          </button>

          <button id="clearSearch" class="rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-sm hover:bg-white/10">
            Clear
          </button>
        </div>
      </div>
    </header>

    <!-- People Drawer -->
    <section id="peopleDrawer" class="hidden border-b border-white/10 bg-zinc-950/60 backdrop-blur">
      <div class="mx-auto max-w-6xl px-4 py-4">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <p class="text-sm font-semibold">People</p>
            <p id="peopleSub" class="text-xs text-zinc-400">
              Detect faces → match → click a person to filter.
            </p>
          </div>

          <div class="flex items-center gap-2">
            <label class="hidden sm:flex items-center gap-2 text-xs text-zinc-300">
              Match threshold
              <input id="threshold" type="range" min="0.35" max="0.70" step="0.01" value="0.52" />
              <span id="thresholdVal" class="w-10 text-right">0.52</span>
            </label>

            <button id="analyzeBtn" class="rounded-xl border border-sky-500/30 bg-sky-500/10 px-3 py-2 text-sm text-sky-200 hover:bg-sky-500/20">
              Analyze faces
            </button>

            <button id="clearPeopleFilter" class="rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-sm hover:bg-white/10">
              Show all
            </button>
          </div>
        </div>

        <div class="mt-3 flex items-center gap-3">
          <div class="h-2 w-full overflow-hidden rounded-full bg-white/10">
            <div id="progressBar" class="h-2 w-0 rounded-full bg-gradient-to-r from-sky-500 to-indigo-500"></div>
          </div>
          <p id="progressText" class="w-28 text-right text-xs text-zinc-400">Idle</p>
        </div>

        <div id="peopleRow" class="mt-4 flex gap-3 overflow-x-auto pb-2"></div>
      </div>
    </section>

    <!-- Main -->
    <main class="mx-auto max-w-6xl px-4 py-6">
      <div class="mb-4 flex items-center justify-between">
        <p id="resultCount" class="text-xs text-zinc-400"></p>
        <p class="text-xs text-zinc-500">Click → fullscreen. Swipe/keys → next/prev.</p>
      </div>

      <div id="grid" class="grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5"></div>

      <footer class="py-10 text-center text-xs text-zinc-500">
        Runs locally. Uses Drive API to list images. Face matching is CPU-heavy because browsers are not supercomputers.
      </footer>
    </main>

    <!-- Fullscreen Viewer -->
    <div id="viewer" class="fixed inset-0 z-[999] hidden">
      <div id="backdrop" class="absolute inset-0 bg-black/90"></div>

      <div class="absolute left-0 right-0 top-0 z-10 flex items-center justify-between px-4 py-3">
        <div class="min-w-0">
          <p id="vTitle" class="truncate text-sm font-semibold text-zinc-100"></p>
          <p id="vMeta" class="truncate text-xs text-zinc-400"></p>
        </div>

        <button
          id="closeBtn"
          class="rounded-full border border-white/10 bg-white/5 px-3 py-2 text-sm text-zinc-200 hover:bg-white/10"
          title="Close (Esc)"
        >
          ✕
        </button>
      </div>

      <div class="absolute inset-0 flex items-center justify-center">
        <button id="prevZone" class="absolute left-0 top-0 h-full w-1/3 cursor-w-resize" aria-label="Previous"></button>
        <button id="nextZone" class="absolute right-0 top-0 h-full w-1/3 cursor-e-resize" aria-label="Next"></button>

        <img
          id="vImg"
          class="max-h-[92vh] max-w-[92vw] select-none rounded-2xl object-contain shadow-2xl shadow-black/60"
          alt="Fullscreen"
          draggable="false"
        />

        <button
          id="prevBtn"
          class="absolute left-4 hidden rounded-full border border-white/10 bg-white/5 px-3 py-3 text-zinc-200 hover:bg-white/10 md:flex"
          title="Previous (←)"
        >
          ←
        </button>
        <button
          id="nextBtn"
          class="absolute right-4 hidden rounded-full border border-white/10 bg-white/5 px-3 py-3 text-zinc-200 hover:bg-white/10 md:flex"
          title="Next (→)"
        >
          →
        </button>

        <div class="pointer-events-none absolute bottom-5 left-1/2 -translate-x-1/2 rounded-full border border-white/10 bg-white/5 px-3 py-2 text-xs text-zinc-300 backdrop-blur">
          Swipe • ←/→ • Tap sides • Esc
        </div>
      </div>
    </div>

    <script>
      // =========================================================
      // CONFIG: Put your Google API key here
      // =========================================================
      const FOLDER_ID = "1T9P69xchFY4_NX7__eg7gXVTOyXT1ppm";
      const API_KEY = "AIzaSyDq1zUnvwrQoOKh9yJPh38zqz6HOvBvCIU"; // <-- change this

      // =========================================================
      // Drive helpers
      // =========================================================
      const driveView = (fileId) => `https://drive.google.com/uc?export=view&id=${fileId}`;
      const PROXY_BASE = "http://localhost:3000/img/";
      const driveImg = (fileId) => `${PROXY_BASE}${fileId}`;

      async function listDriveImages(folderId) {
        // NOTE: This requires the folder/files to be shared as "Anyone with the link: Viewer"
        const q = `'${folderId}' in parents and trashed=false and mimeType contains 'image/'`;
        const fields = "nextPageToken,files(id,name,mimeType,createdTime,modifiedTime)";
        const pageSize = 1000;

        let out = [];
        let pageToken = "";

        while (true) {
          const url =
            `https://www.googleapis.com/drive/v3/files` +
            `?key=${encodeURIComponent(API_KEY)}` +
            `&q=${encodeURIComponent(q)}` +
            `&fields=${encodeURIComponent(fields)}` +
            `&pageSize=${pageSize}` +
            (pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : "");

          const res = await fetch(url);
          if (!res.ok) {
            const txt = await res.text().catch(() => "");
            throw new Error(`Drive API error ${res.status}: ${txt || "no details"}`);
          }

          const data = await res.json();
          out = out.concat(data.files || []);
          if (!data.nextPageToken) break;
          pageToken = data.nextPageToken;
        }

        // Sort newest first by modifiedTime (fallback createdTime)
        out.sort((a, b) => (b.modifiedTime || b.createdTime || "").localeCompare(a.modifiedTime || a.createdTime || ""));
        return out;
      }

      // =========================================================
      // UI State
      // =========================================================
      let photos = [];             // loaded from Drive
      let query = "";
      let peopleFilter = null;     // clusterId or null
      let filtered = [];
      let currentIndex = -1;

      // Face analysis cache
      let modelsLoaded = false;
      let analyzing = false;
      let faceIndex = null; // { clusters: [...], photoFaces: Map(photoKey -> [clusterId...]) }

      // =========================================================
      // Elements
      // =========================================================
      const statusLine = document.getElementById("statusLine");
      const grid = document.getElementById("grid");
      const resultCount = document.getElementById("resultCount");
      const searchInput = document.getElementById("searchInput");
      const clearSearch = document.getElementById("clearSearch");

      const viewer = document.getElementById("viewer");
      const backdrop = document.getElementById("backdrop");
      const vImg = document.getElementById("vImg");
      const vTitle = document.getElementById("vTitle");
      const vMeta = document.getElementById("vMeta");
      const closeBtn = document.getElementById("closeBtn");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const prevZone = document.getElementById("prevZone");
      const nextZone = document.getElementById("nextZone");

      const peopleToggle = document.getElementById("peopleToggle");
      const peopleDrawer = document.getElementById("peopleDrawer");
      const analyzeBtn = document.getElementById("analyzeBtn");
      const peopleRow = document.getElementById("peopleRow");
      const peopleSub = document.getElementById("peopleSub");
      const progressBar = document.getElementById("progressBar");
      const progressText = document.getElementById("progressText");
      const clearPeopleFilter = document.getElementById("clearPeopleFilter");

      const threshold = document.getElementById("threshold");
      const thresholdVal = document.getElementById("thresholdVal");

      // =========================================================
      // Gallery filtering
      // =========================================================
      function matchesText(p) {
        if (!query.trim()) return true;
        const q = query.trim().toLowerCase();
        return (`${p.title} ${p.meta}`).toLowerCase().includes(q);
      }

      function matchesPeople(p) {
        if (!peopleFilter) return true;
        if (!faceIndex) return false;
        const key = String(p.id);
        const ids = faceIndex.photoFaces.get(key) || [];
        return ids.includes(peopleFilter);
      }

      function render() {
        filtered = photos.filter(p => matchesText(p) && matchesPeople(p));
        resultCount.textContent = `${filtered.length} items`;

        grid.innerHTML = filtered.map((p, i) => `
          <button
            class="group relative aspect-square overflow-hidden rounded-2xl border border-white/10 bg-white/5"
            data-index="${i}"
            title="${escapeHtml(p.title)}"
          >
            <img
              src="${p.thumbSrc}"
              alt="${escapeHtml(p.title)}"
              class="h-full w-full object-cover opacity-90 transition group-hover:opacity-100"
              loading="lazy"
              crossorigin="anonymous"
            />
            <div class="absolute inset-0 opacity-0 transition group-hover:opacity-100">
              <div class="absolute inset-0 bg-black/25"></div>
              <div class="absolute bottom-3 left-3 text-xs text-zinc-100">
                <p class="font-medium">${escapeHtml(p.title)}</p>
                <p class="text-zinc-300">${escapeHtml(p.meta)}</p>
              </div>
            </div>
          </button>
        `).join("");

        grid.querySelectorAll("button[data-index]").forEach(btn => {
          btn.addEventListener("click", () => openViewer(Number(btn.dataset.index)));
        });
      }

      function escapeHtml(s) {
        return String(s || "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
        }[c]));
      }

      // =========================================================
      // Fullscreen viewer
      // =========================================================
      function openViewer(index) {
        currentIndex = index;
        const p = filtered[currentIndex];
        if (!p) return;

        viewer.classList.remove("hidden");
        document.body.classList.add("overflow-hidden");

        vImg.src = p.fullSrc;
        vTitle.textContent = p.title;
        vMeta.textContent = p.meta;
      }

      function closeViewer() {
        viewer.classList.add("hidden");
        document.body.classList.remove("overflow-hidden");
        currentIndex = -1;
      }

      function next() {
        if (!filtered.length) return;
        currentIndex = (currentIndex + 1) % filtered.length;
        openViewer(currentIndex);
      }

      function prev() {
        if (!filtered.length) return;
        currentIndex = (currentIndex - 1 + filtered.length) % filtered.length;
        openViewer(currentIndex);
      }

      // Swipe
      let touchStartX = 0, touchStartY = 0;
      viewer.addEventListener("touchstart", (e) => {
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
      }, { passive: true });

      viewer.addEventListener("touchend", (e) => {
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;
        if (Math.abs(dy) > Math.abs(dx)) return;
        if (dx < -40) next();
        if (dx > 40) prev();
      }, { passive: true });

      // =========================================================
      // People (Face detect + cluster)
      // =========================================================
      const MODEL_BASE = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@0.30.5/model/";

      function setProgress(pct, label) {
        progressBar.style.width = `${Math.max(0, Math.min(100, pct))}%`;
        progressText.textContent = label;
      }

      async function loadModelsOnce() {
        if (modelsLoaded) return;
        setProgress(5, "Loading models…");

        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_BASE);
        await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_BASE);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_BASE);

        modelsLoaded = true;
        setProgress(10, "Models loaded");
      }

      function euclideanDistance(a, b) {
        let sum = 0;
        for (let i = 0; i < a.length; i++) {
          const d = a[i] - b[i];
          sum += d * d;
        }
        return Math.sqrt(sum);
      }

      function meanDescriptor(list) {
        const n = list.length;
        const dim = list[0].length;
        const out = new Float32Array(dim);
        for (const v of list) for (let i = 0; i < dim; i++) out[i] += v[i];
        for (let i = 0; i < dim; i++) out[i] /= n;
        return out;
      }

      function cropFaceThumb(img, box, size = 96) {
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");

        const pad = 0.25;
        const x = Math.max(0, box.x - box.width * pad);
        const y = Math.max(0, box.y - box.height * pad);
        const w = Math.min(img.width - x, box.width * (1 + pad * 2));
        const h = Math.min(img.height - y, box.height * (1 + pad * 2));

        ctx.drawImage(img, x, y, w, h, 0, 0, size, size);
        return canvas.toDataURL("image/jpeg", 0.85);
      }

      async function loadImage(url) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = url;
        });
      }

      function renderPeopleClusters(clusters) {
        peopleRow.innerHTML = "";

        if (!clusters.length) {
          peopleRow.innerHTML = `<p class="text-xs text-zinc-400">No faces found (or images too small/unclear).</p>`;
          return;
        }

        const sorted = [...clusters].sort((a, b) => b.photoIds.size - a.photoIds.size);

        for (const c of sorted) {
          const count = c.photoIds.size;
          const card = document.createElement("button");
          card.className =
            "flex flex-col items-center gap-2 rounded-2xl border border-white/10 bg-white/5 px-3 py-3 hover:bg-white/10 min-w-[110px]";
          card.innerHTML = `
            <img src="${c.thumb}" class="h-16 w-16 rounded-full object-cover border border-white/10" alt="person"/>
            <div class="text-center">
              <p class="text-xs font-semibold text-zinc-100">Person ${c.clusterId}</p>
              <p class="text-[11px] text-zinc-400">${count} photos</p>
            </div>
          `;
          card.addEventListener("click", () => {
            peopleFilter = c.clusterId;
            render();
          });
          peopleRow.appendChild(card);
        }
      }

      async function analyzeFaces() {
        if (analyzing) return;
        if (!photos.length) {
          peopleSub.textContent = "No photos loaded yet. Fix Drive loading first.";
          return;
        }

        analyzing = true;
        analyzeBtn.disabled = true;
        analyzeBtn.classList.add("opacity-60", "cursor-not-allowed");

        peopleSub.textContent = "Analyzing… this can take a bit depending on image count and your machine.";
        setProgress(0, "Starting…");

        try {
          await loadModelsOnce();

          const thresholdValue = Number(threshold.value);

          const clusters = []; // { clusterId, descriptors: [Float32Array], mean: Float32Array, photoIds:Set, thumb:string }
          const photoFaces = new Map(); // photoId -> [clusterId...]

          const options = new faceapi.TinyFaceDetectorOptions({
            inputSize: 416, // higher = more accurate, slower
            scoreThreshold: 0.5
          });

          for (let i = 0; i < photos.length; i++) {
            const p = photos[i];
            setProgress(10 + (i / photos.length) * 80, `Scanning ${i + 1}/${photos.length}`);

            const img = await loadImage(p.fullSrc);

            const detections = await faceapi
              .detectAllFaces(img, options)
              .withFaceLandmarks(true)
              .withFaceDescriptors();

            if (!detections.length) continue;

            const assigned = [];
            for (const det of detections) {
              const desc = det.descriptor;

              let best = null;
              let bestDist = Infinity;

              for (const c of clusters) {
                const dist = euclideanDistance(c.mean, desc);
                if (dist < bestDist) {
                  bestDist = dist;
                  best = c;
                }
              }

              if (best && bestDist <= thresholdValue) {
                best.descriptors.push(desc);
                best.mean = meanDescriptor(best.descriptors);
                best.photoIds.add(String(p.id));
                assigned.push(best.clusterId);
              } else {
                const newId = clusters.length + 1;
                const box = det.detection.box;
                const thumbData = cropFaceThumb(img, box, 96);

                clusters.push({
                  clusterId: newId,
                  descriptors: [desc],
                  mean: desc,
                  photoIds: new Set([String(p.id)]),
                  thumb: thumbData,
                });
                assigned.push(newId);
              }
            }

            const key = String(p.id);
            const uniq = Array.from(new Set(assigned));
            photoFaces.set(key, uniq);
          }

          faceIndex = { clusters, photoFaces };

          setProgress(100, "Done");
          peopleSub.textContent = `Found ${clusters.length} face clusters. Click a person to filter.`;
          renderPeopleClusters(clusters);
        } catch (err) {
          console.error(err);
          peopleSub.textContent =
            "Face analysis failed. Most common causes: CORS issues or opening as file://. Use Live Server.";
          setProgress(0, "Error");
        } finally {
          analyzing = false;
          analyzeBtn.disabled = false;
          analyzeBtn.classList.remove("opacity-60", "cursor-not-allowed");
        }
      }

      // =========================================================
      // Events
      // =========================================================
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          query = e.target.value;
          render();
        });
      }

      clearSearch.addEventListener("click", () => {
        query = "";
        if (searchInput) searchInput.value = "";
        render();
      });

      peopleToggle.addEventListener("click", () => {
        peopleDrawer.classList.toggle("hidden");
      });

      analyzeBtn.addEventListener("click", analyzeFaces);

      clearPeopleFilter.addEventListener("click", () => {
        peopleFilter = null;
        render();
      });

      threshold.addEventListener("input", () => {
        thresholdVal.textContent = Number(threshold.value).toFixed(2);
      });

      // Viewer
      document.getElementById("closeBtn").addEventListener("click", closeViewer);
      backdrop.addEventListener("click", closeViewer);
      nextBtn.addEventListener("click", next);
      prevBtn.addEventListener("click", prev);
      nextZone.addEventListener("click", next);
      prevZone.addEventListener("click", prev);

      window.addEventListener("keydown", (e) => {
        if (!viewer.classList.contains("hidden")) {
          if (e.key === "Escape") closeViewer();
          if (e.key === "ArrowRight") next();
          if (e.key === "ArrowLeft") prev();
        }
      });

      // =========================================================
      // Boot: Load Drive images, then render
      // =========================================================
      async function boot() {
        thresholdVal.textContent = Number(threshold.value).toFixed(2);

        if (!API_KEY || API_KEY.includes("PASTE_YOUR_API_KEY_HERE")) {
          statusLine.textContent = "Paste your Google API key in the code (API_KEY).";
          resultCount.textContent = "0 items";
          return;
        }

        try {
          statusLine.textContent = "Listing images from Drive…";
          const files = await listDriveImages(FOLDER_ID);

          photos = files.map((f, idx) => {
            const when = (f.modifiedTime || f.createdTime || "").slice(0, 10);
            return {
              id: f.id,
              title: f.name || `Image ${idx + 1}`,
              meta: when ? when : "Drive image",
              thumbSrc: driveImg(f.id),
              fullSrc: driveImg(f.id),
            };
          });

          statusLine.textContent = `Loaded ${photos.length} Drive images.`;
          render();
        } catch (e) {
          console.error(e);
          statusLine.textContent = "Drive load failed. Check: API key, Drive API enabled, folder shared publicly.";
          resultCount.textContent = "0 items";
        }
      }

      boot();
    </script>
  </body>
</html>
